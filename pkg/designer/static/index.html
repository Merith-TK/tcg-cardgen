<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCG Cardstyle Designer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #1a1a2e;
    --surface:  #16213e;
    --panel:    #0f3460;
    --accent:   #e94560;
    --accent2:  #533483;
    --text:     #e0e0e0;
    --text-dim: #888;
    --border:   #2a2a4a;
    --input-bg: #0d1b2a;
    --radius:   6px;
    --sidebar-w: 260px;
    --prop-w:    280px;
  }

  body { font-family: system-ui, -apple-system, sans-serif; font-size: 13px;
         background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr var(--prop-w);
         grid-template-rows: 44px 1fr; height: 100vh; }

  /* ── toolbar ── */
  .toolbar { grid-column: 1 / -1; background: var(--surface); border-bottom: 1px solid var(--border);
             display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .toolbar h1 { font-size: 15px; font-weight: 700; color: var(--accent); margin-right: 8px; }
  .sep { flex: 1; }

  /* ── sidebar ── */
  .sidebar { background: var(--surface); border-right: 1px solid var(--border);
             display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-section { padding: 8px; border-bottom: 1px solid var(--border); }
  .sidebar-section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
                        color: var(--text-dim); margin-bottom: 6px; }
  .template-list { overflow-y: auto; flex: 1; }
  .template-item { padding: 6px 10px; cursor: pointer; border-radius: var(--radius); }
  .template-item:hover { background: var(--panel); }
  .template-item.active { background: var(--accent2); }
  .template-item .tcg { font-size: 10px; color: var(--text-dim); }

  .layer-list { overflow-y: auto; max-height: 260px; }
  .layer-item { display: flex; align-items: center; gap: 6px; padding: 5px 8px;
                cursor: pointer; border-radius: var(--radius); }
  .layer-item:hover { background: var(--panel); }
  .layer-item.active { background: var(--accent2); }
  .layer-item .layer-type { font-size: 10px; color: var(--text-dim); margin-left: auto; }
  .layer-item .del-btn { margin-left: auto; background: none; border: none; color: var(--text-dim);
                         cursor: pointer; font-size: 14px; padding: 0 2px; }
  .layer-item .del-btn:hover { color: var(--accent); }

  /* ── canvas area ── */
  .canvas-area { display: flex; align-items: center; justify-content: center;
                 background: var(--bg); overflow: auto; padding: 24px; }
  .card-preview { position: relative; background: #222; box-shadow: 0 8px 32px rgba(0,0,0,.6); }
  .card-preview img { display: block; max-width: 100%; max-height: calc(100vh - 120px); }
  .preview-placeholder { display: flex; align-items: center; justify-content: center;
                          color: var(--text-dim); font-size: 14px; min-width: 300px; min-height: 400px; }

  /* ── properties ── */
  .props { background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 12px; }
  .props h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
              color: var(--text-dim); margin-bottom: 10px; }
  .prop-group { margin-bottom: 12px; }
  .prop-group label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
  .prop-group input, .prop-group select, .prop-group textarea {
    width: 100%; background: var(--input-bg); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius); padding: 5px 8px; font-size: 12px; }
  .prop-group textarea { min-height: 60px; resize: vertical; font-family: monospace; }
  .region-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  /* ── shared controls ── */
  button { background: var(--panel); border: 1px solid var(--border); color: var(--text);
           border-radius: var(--radius); padding: 5px 12px; cursor: pointer; font-size: 12px; }
  button:hover { background: var(--accent2); }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button.primary:hover { opacity: .85; }
  select { background: var(--input-bg); border: 1px solid var(--border); color: var(--text);
           border-radius: var(--radius); padding: 4px 6px; font-size: 12px; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 6px;
           border-radius: 99px; background: var(--accent2); color: #fff; }

  /* ── status bar ── */
  .status { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
            border-top: 1px solid var(--border); padding: 3px 12px; font-size: 11px;
            color: var(--text-dim); z-index: 10; }
  .status.err { color: #f66; }
</style>
</head>
<body>
<div id="app"></div>

<!-- Preact + HTM via CDN — no build step required -->
<script type="module">
import { h, render, Fragment } from 'https://esm.sh/preact@10.19.3';
import { useState, useEffect, useCallback, useRef } from 'https://esm.sh/preact@10.19.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';

const html = htm.bind(h);

// ─── API helpers ─────────────────────────────────────────────────────────────

async function apiFetch(path, opts = {}) {
  const res = await fetch(path, opts);
  const ct = res.headers.get('content-type') || '';
  if (!res.ok) {
    const body = ct.includes('json') ? (await res.json()).error : await res.text();
    throw new Error(body || `HTTP ${res.status}`);
  }
  if (ct.includes('json')) return res.json();
  return res.text();
}

// ─── App ──────────────────────────────────────────────────────────────────────

function App() {
  const [templates, setTemplates] = useState({});
  const [selectedTemplate, setSelectedTemplate] = useState(null);
  const [templateData, setTemplateData] = useState(null);
  const [selectedLayer, setSelectedLayer] = useState(null);
  const [previewSrc, setPreviewSrc] = useState(null);
  const [status, setStatus] = useState({ msg: 'Loading templates…', err: false });
  const [cardFields, setCardFields] = useState({ title: 'Preview Card', rarity: 'common' });

  // Load template list on mount.
  useEffect(() => {
    apiFetch('/api/templates')
      .then(data => { setTemplates(data); setStatus({ msg: 'Ready', err: false }); })
      .catch(e => setStatus({ msg: e.message, err: true }));
  }, []);

  // Load full template when selection changes.
  useEffect(() => {
    if (!selectedTemplate) return;
    const [tcg, name] = selectedTemplate.split('/');
    setStatus({ msg: `Loading ${tcg}/${name}…`, err: false });
    apiFetch(`/api/template?tcg=${tcg}&name=${name}`)
      .then(data => {
        setTemplateData(data);
        setSelectedLayer(null);
        setStatus({ msg: `Loaded ${tcg}/${name}`, err: false });
        renderPreview(data, cardFields);
      })
      .catch(e => setStatus({ msg: e.message, err: true }));
  }, [selectedTemplate]);

  const renderPreview = useCallback((tmpl, fields) => {
    if (!tmpl) return;
    setStatus({ msg: 'Rendering…', err: false });
    apiFetch('/api/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ template: tmpl, card: fields }),
    })
      .then(data => {
        setPreviewSrc(data.image);
        setStatus({ msg: 'Rendered OK', err: false });
      })
      .catch(e => setStatus({ msg: 'Render error: ' + e.message, err: true }));
  }, []);

  const handleLayerChange = (idx, updated) => {
    const layers = [...templateData.layers];
    layers[idx] = updated;
    const updated_t = { ...templateData, layers };
    setTemplateData(updated_t);
    renderPreview(updated_t, cardFields);
  };

  const addLayer = (type) => {
    const newLayer = {
      name: `${type}_${Date.now()}`,
      type,
      region: { x: 10, y: 10, width: 100, height: 100 },
      ...(type === 'text' ? { content: 'New text', align: 'left', font: { size: 14, color: '#000000' } } : {}),
      ...(type === 'shape' ? { shape: 'rectangle', fill: '#ccccccff' } : {}),
      ...(type === 'image' ? { source: '', fit_mode: 'fill' } : {}),
    };
    const layers = [...(templateData?.layers || []), newLayer];
    const updated = { ...templateData, layers };
    setTemplateData(updated);
    setSelectedLayer(layers.length - 1);
    renderPreview(updated, cardFields);
  };

  const deleteLayer = (idx) => {
    const layers = templateData.layers.filter((_, i) => i !== idx);
    const updated = { ...templateData, layers };
    setTemplateData(updated);
    if (selectedLayer === idx) setSelectedLayer(null);
    renderPreview(updated, cardFields);
  };

  const saveTemplate = () => {
    if (!templateData) return;
    apiFetch('/api/template', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(templateData),
    })
      .then(d => setStatus({ msg: `Saved → ${d.path}`, err: false }))
      .catch(e => setStatus({ msg: 'Save error: ' + e.message, err: true }));
  };

  const exportYAML = () => {
    if (!templateData) return;
    apiFetch('/api/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(templateData),
    })
      .then(yaml => {
        const blob = new Blob([yaml], { type: 'text/yaml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = (templateData.name || 'template') + '.yaml'; a.click();
        URL.revokeObjectURL(url);
      })
      .catch(e => setStatus({ msg: 'Export error: ' + e.message, err: true }));
  };

  // Render templates grouped by TCG.
  const templateItems = Object.entries(templates).flatMap(([tcg, styles]) =>
    styles.map(s => html`
      <div key="${tcg+'/'+s.Name}"
           class=${'template-item' + (selectedTemplate === tcg+'/'+s.Name ? ' active' : '')}
           onClick=${() => setSelectedTemplate(tcg+'/'+s.Name)}>
        <div>${s.DisplayName || s.Name}</div>
        <div class="tcg">${tcg}</div>
      </div>
    `)
  );

  const layerItems = (templateData?.layers || []).map((l, i) => html`
    <div key=${i} class=${'layer-item' + (selectedLayer === i ? ' active' : '')}
         onClick=${() => setSelectedLayer(i)}>
      <span>${l.name || '(unnamed)'}</span>
      <span class="layer-type">${l.type}</span>
      <button class="del-btn" onClick=${e => { e.stopPropagation(); deleteLayer(i); }}>×</button>
    </div>
  `);

  const currentLayer = selectedLayer !== null && templateData?.layers?.[selectedLayer];

  return html`
    <div class="app">
      <!-- Toolbar -->
      <div class="toolbar">
        <h1>TCG Cardstyle Designer</h1>
        ${templateData ? html`
          <span class="badge">${templateData.tcg || '?'}/${templateData.name || '?'}</span>
        ` : null}
        <span class="sep"/>
        <button onClick=${() => addLayer('image')}>+ Image</button>
        <button onClick=${() => addLayer('text')}>+ Text</button>
        <button onClick=${() => addLayer('shape')}>+ Shape</button>
        <button class="primary" onClick=${saveTemplate} disabled=${!templateData}>Save</button>
        <button onClick=${exportYAML} disabled=${!templateData}>Export YAML</button>
        <button onClick=${() => renderPreview(templateData, cardFields)} disabled=${!templateData}>↻ Refresh</button>
      </div>

      <!-- Left sidebar -->
      <div class="sidebar">
        <div class="sidebar-section">
          <h2>Templates</h2>
        </div>
        <div class="template-list">${templateItems}</div>
        <div class="sidebar-section">
          <h2>Layers</h2>
        </div>
        <div class="layer-list">${layerItems}</div>
        <!-- Quick card field overrides for preview -->
        <div class="sidebar-section" style="margin-top:auto">
          <h2>Preview Card Data</h2>
          ${Object.entries(cardFields).map(([k, v]) => html`
            <div class="prop-group" key=${k}>
              <label>${k}</label>
              <input value=${v} onInput=${e => {
                const nf = { ...cardFields, [k]: e.target.value };
                setCardFields(nf);
                if (templateData) renderPreview(templateData, nf);
              }} />
            </div>
          `)}
        </div>
      </div>

      <!-- Canvas -->
      <div class="canvas-area">
        <div class="card-preview">
          ${previewSrc
            ? html`<img src=${previewSrc} alt="card preview" />`
            : html`<div class="preview-placeholder">Select a template to preview</div>`}
        </div>
      </div>

      <!-- Properties panel -->
      <div class="props">
        <h2>Properties</h2>
        ${currentLayer
          ? html`<${LayerProps} layer=${currentLayer} idx=${selectedLayer}
                   onChange=${handleLayerChange} />`
          : html`<p style="color:var(--text-dim);font-size:12px">Select a layer to edit its properties.</p>`}
      </div>
    </div>

    <div class=${'status' + (status.err ? ' err' : '')}>${status.msg}</div>
  `;
}

// ─── LayerProps ───────────────────────────────────────────────────────────────

function LayerProps({ layer, idx, onChange }) {
  const update = (field, value) => {
    // Support dot-path updates: "region.x", "font.size", etc.
    const parts = field.split('.');
    if (parts.length === 1) {
      onChange(idx, { ...layer, [field]: value });
    } else if (parts.length === 2) {
      onChange(idx, { ...layer, [parts[0]]: { ...layer[parts[0]], [parts[1]]: value } });
    }
  };

  const num = (v) => isNaN(parseInt(v)) ? v : parseInt(v);

  return html`
    <div class="prop-group">
      <label>Name</label>
      <input value=${layer.name || ''} onInput=${e => update('name', e.target.value)} />
    </div>
    <div class="prop-group">
      <label>Type</label>
      <select value=${layer.type} onChange=${e => update('type', e.target.value)}>
        <option value="image">image</option>
        <option value="text">text</option>
        <option value="shape">shape</option>
      </select>
    </div>
    <div class="prop-group">
      <label>Condition</label>
      <input value=${layer.condition || ''} placeholder="e.g. {{mtg.power}}"
             onInput=${e => update('condition', e.target.value)} />
    </div>

    <!-- Region -->
    <div class="prop-group">
      <label>Region</label>
      <div class="region-grid">
        ${['x','y','width','height'].map(f => html`
          <div key=${f}>
            <label>${f}</label>
            <input type="number" value=${layer.region?.[f] ?? 0}
                   onInput=${e => update('region.'+f, num(e.target.value))} />
          </div>
        `)}
      </div>
    </div>

    <!-- Image-specific -->
    ${layer.type === 'image' ? html`
      <div class="prop-group">
        <label>Source</label>
        <input value=${layer.source || ''} placeholder="{{card.artwork}}"
               onInput=${e => update('source', e.target.value)} />
      </div>
      <div class="prop-group">
        <label>Fallback</label>
        <input value=${layer.fallback || ''} onInput=${e => update('fallback', e.target.value)} />
      </div>
      <div class="prop-group">
        <label>Fit Mode</label>
        <select value=${layer.fit_mode || 'fill'} onChange=${e => update('fit_mode', e.target.value)}>
          <option value="fill">fill</option>
          <option value="fit">fit</option>
          <option value="stretch">stretch</option>
          <option value="center">center</option>
        </select>
      </div>
    ` : null}

    <!-- Text-specific -->
    ${layer.type === 'text' ? html`
      <div class="prop-group">
        <label>Content</label>
        <input value=${layer.content || ''} placeholder="{{card.title}}"
               onInput=${e => update('content', e.target.value)} />
      </div>
      <div class="prop-group">
        <label>Align</label>
        <select value=${layer.align || 'left'} onChange=${e => update('align', e.target.value)}>
          <option value="left">left</option>
          <option value="center">center</option>
          <option value="right">right</option>
        </select>
      </div>
      <div class="prop-group">
        <label>Font Family</label>
        <input value=${layer.font?.family || ''} placeholder="e.g. Beleren"
               onInput=${e => update('font.family', e.target.value)} />
      </div>
      <div class="prop-group">
        <label>Font Size</label>
        <input type="number" value=${layer.font?.size || 12}
               onInput=${e => update('font.size', num(e.target.value))} />
      </div>
      <div class="prop-group">
        <label>Font Color</label>
        <input value=${layer.font?.color || '#000000'}
               onInput=${e => update('font.color', e.target.value)} />
      </div>
    ` : null}

    <!-- Shape-specific -->
    ${layer.type === 'shape' ? html`
      <div class="prop-group">
        <label>Shape</label>
        <select value=${layer.shape || 'rectangle'} onChange=${e => update('shape', e.target.value)}>
          <option value="rectangle">rectangle</option>
          <option value="circle">circle</option>
          <option value="ellipse">ellipse</option>
          <option value="polygon">polygon</option>
        </select>
      </div>
      <div class="prop-group">
        <label>Fill Color (#RRGGBBAA)</label>
        <input value=${layer.fill || ''} placeholder="#RRGGBBAA"
               onInput=${e => update('fill', e.target.value)} />
      </div>
      <div class="prop-group">
        <label>Stroke Color</label>
        <input value=${layer.stroke || ''} placeholder="#RRGGBBAA"
               onInput=${e => update('stroke', e.target.value)} />
      </div>
      <div class="prop-group">
        <label>Stroke Width</label>
        <input type="number" value=${layer.stroke_width || 0}
               onInput=${e => update('stroke_width', parseFloat(e.target.value) || 0)} />
      </div>
      <div class="prop-group">
        <label>Corner Radius</label>
        <input type="number" value=${layer.corner_radius || 0}
               onInput=${e => update('corner_radius', parseFloat(e.target.value) || 0)} />
      </div>
    ` : null}
  `;
}

// ─── Mount ────────────────────────────────────────────────────────────────────
render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
